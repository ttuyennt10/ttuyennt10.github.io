<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ Cá Sinh Động</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0b2545 0%, #134074 45%, #0a2440 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: #bae6fd;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.26);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.97);
    }

    .aquarium {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 72vh;
      min-height: 460px;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid rgba(186, 230, 253, 0.35);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 0 0 80px rgba(56, 189, 248, 0.22);
      background:
        radial-gradient(circle at 20% 10%, rgba(125, 211, 252, 0.28), transparent 40%),
        radial-gradient(circle at 80% 15%, rgba(186, 230, 253, 0.22), transparent 45%),
        linear-gradient(180deg, #0ea5e9 0%, #0369a1 35%, #082f49 85%, #162436 100%);
    }

    .light-rays {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -25deg,
        rgba(255, 255, 255, 0.04) 0px,
        rgba(255, 255, 255, 0.04) 24px,
        transparent 24px,
        transparent 75px
      );
      pointer-events: none;
      z-index: 1;
    }

    .seabed {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: linear-gradient(180deg, #d6b87c 0%, #b08d57 100%);
      border-top: 2px solid rgba(255, 248, 220, 0.45);
      z-index: 2;
    }

    .creature {
      position: absolute;
      user-select: none;
      cursor: pointer;
      z-index: 4;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
      transition: filter 0.2s ease;
    }

    .creature:hover {
      filter: drop-shadow(0 8px 16px rgba(255, 255, 255, 0.45));
      z-index: 6;
    }

    .creature img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(186, 230, 253, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 3;
      animation: rise linear forwards;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0.8;
      }
      70% {
        opacity: 0.65;
      }
      100% {
        transform: translateY(-540px) scale(1.15);
        opacity: 0;
      }
    }

    .hint {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>🌊 Web Hồ Cá Sinh Động</h1>
      <p>Click vào từng sinh vật để tăng tốc bơi • Dùng các nút bên phải để tùy chỉnh hồ</p>
    </div>
    <div class="controls">
      <button id="btnAddDiver">+ Thêm thợ lặn</button>
      <button id="btnAddFish">+ Thêm đàn cá</button>
      <button id="btnBubble">🫧 Bọt khí: Bật</button>
      <button id="btnReset">🔄 Đặt lại hồ</button>
    </div>
  </div>

  <div class="aquarium" id="aquarium">
    <div class="light-rays"></div>
    <div class="seabed"></div>
  </div>

  <script>
    const aquarium = document.getElementById("aquarium");
    const btnAddDiver = document.getElementById("btnAddDiver");
    const btnAddFish = document.getElementById("btnAddFish");
    const btnBubble = document.getElementById("btnBubble");
    const btnReset = document.getElementById("btnReset");

    const CREATURE_TYPES = {
      shark: { src: "shark.png", width: 175, minSpeed: 1.2, maxSpeed: 2.0, faceRight: true },
      turtle: { src: "turtle.png", width: 120, minSpeed: 0.8, maxSpeed: 1.4, faceRight: true },
      goldFish: { src: "goldFishSchool.png", width: 115, minSpeed: 1.0, maxSpeed: 1.7, faceRight: true },
      faintSchool: { src: "faintSchool.png", width: 125, minSpeed: 1.1, maxSpeed: 1.8, faceRight: true },
      diver1: { src: "diver1.png", width: 135, minSpeed: 0.65, maxSpeed: 1.1, faceRight: true },
      diver2: { src: "diver2.png", width: 135, minSpeed: 0.65, maxSpeed: 1.1, faceRight: true },
      diver3: { src: "diver3.png", width: 135, minSpeed: 0.65, maxSpeed: 1.1, faceRight: true }
    };

    let creatures = [];
    let bubbleEnabled = true;
    let bubbleTimer = null;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createCreature(typeKey, customX = null, customY = null) {
      const cfg = CREATURE_TYPES[typeKey];
      if (!cfg) return;

      const el = document.createElement("div");
      el.className = "creature";
      el.style.width = `${cfg.width}px`;

      const img = document.createElement("img");
      img.src = cfg.src;
      img.alt = typeKey;
      el.appendChild(img);

      const bounds = aquarium.getBoundingClientRect();
      const maxX = Math.max(50, bounds.width - cfg.width - 20);
      const maxY = Math.max(80, bounds.height - 150);

      const dir = Math.random() < 0.5 ? 1 : -1;
      const speed = randomBetween(cfg.minSpeed, cfg.maxSpeed);

      const item = {
        el,
        img,
        width: cfg.width,
        x: customX !== null ? customX : randomBetween(20, maxX),
        y: customY !== null ? customY : randomBetween(30, maxY),
        vx: dir * speed,
        vy: randomBetween(-0.25, 0.25),
        phase: randomBetween(0, Math.PI * 2),
        boost: 1
      };

      el.addEventListener("click", () => {
        item.boost = 2.4;
        setTimeout(() => {
          item.boost = 1;
        }, 1200);
      });

      aquarium.appendChild(el);
      creatures.push(item);
    }

    function initAquarium() {
      creatures.forEach(c => c.el.remove());
      creatures = [];

      createCreature("shark", 120, 120);
      createCreature("turtle", 420, 260);
      createCreature("goldFish", 680, 110);
      createCreature("faintSchool", 260, 310);
      createCreature("diver1", 560, 180);
      createCreature("diver2", 80, 230);
      createCreature("diver3", 760, 270);
    }

    function update() {
      const bounds = aquarium.getBoundingClientRect();
      const w = bounds.width;
      const h = bounds.height - 68;

      for (const c of creatures) {
        c.phase += 0.035;
        const bobY = Math.sin(c.phase) * 0.45;

        c.x += c.vx * c.boost;
        c.y += (c.vy + bobY) * (c.boost > 1 ? 1.3 : 1);

        if (c.x <= 8) {
          c.x = 8;
          c.vx = Math.abs(c.vx);
        } else if (c.x + c.width >= w - 8) {
          c.x = w - 8 - c.width;
          c.vx = -Math.abs(c.vx);
        }

        const estHeight = c.width * 0.55;
        if (c.y <= 16) {
          c.y = 16;
          c.vy = Math.abs(c.vy);
        } else if (c.y + estHeight >= h) {
          c.y = h - estHeight;
          c.vy = -Math.abs(c.vy);
        }

        const scaleX = c.vx >= 0 ? 1 : -1;
        c.el.style.transform = `translate3d(${c.x}px, ${c.y}px, 0) scaleX(${scaleX})`;
      }

      requestAnimationFrame(update);
    }

    function spawnBubble() {
      if (!bubbleEnabled) return;
      const bounds = aquarium.getBoundingClientRect();
      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const size = randomBetween(6, 18);
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${randomBetween(20, Math.max(40, bounds.width - 30))}px`;
      bubble.style.animationDuration = `${randomBetween(3.5, 6.5)}s`;

      aquarium.appendChild(bubble);
      setTimeout(() => bubble.remove(), 6800);
    }

    btnAddDiver.addEventListener("click", () => {
      const divers = ["diver1", "diver2", "diver3"];
      const pick = divers[Math.floor(Math.random() * divers.length)];
      createCreature(pick);
    });

    btnAddFish.addEventListener("click", () => {
      const schools = ["goldFish", "faintSchool", "turtle", "shark"];
      const pick = schools[Math.floor(Math.random() * schools.length)];
      createCreature(pick);
    });

    btnBubble.addEventListener("click", () => {
      bubbleEnabled = !bubbleEnabled;
      btnBubble.textContent = bubbleEnabled ? "🫧 Bọt khí: Bật" : "🫧 Bọt khí: Tắt";
    });

    btnReset.addEventListener("click", initAquarium);

    initAquarium();
    bubbleTimer = setInterval(spawnBubble, 450);
    requestAnimationFrame(update);
  </script>
</body>
</html>
