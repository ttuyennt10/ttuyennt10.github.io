<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Chủ Bài Tập - Nguyễn Thị Thanh Tuyền</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 60%, #ffedd5 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 26px;
      color: #0b5a8a;
      margin-bottom: 8px;
    }

    p {
      color: #475569;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }

    .card-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 22px 14px;
      color: #0f172a;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .card-link:hover {
      border-color: #0284c7;
      background: #f0f9ff;
      transform: translateY(-4px);
      color: #0b5a8a;
    }

    .emoji {
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🌸 Trang Tổng Hợp Bài Thực Hành</h1>
    <p>Nguyễn Thị Thanh Tuyền • GitHub Pages</p>

    <div class="menu">
      <a class="card-link" href="./hocasinhdong/index.html">
        <span class="emoji">🐠</span>
        <span>Hồ Cá Sinh Động</span>
      </a>

      <a class="card-link" href="./CV cá nhân/index.html">
        <span class="emoji">📄</span>
        <span>CV Cá Nhân</span>
      </a>

      <a class="card-link" href="./hàng hóa/index.html">
        <span class="emoji">🛍️</span>
        <span>Hàng Hóa</span>
      </a>
    </div>
  </div>
</body>
</html>
